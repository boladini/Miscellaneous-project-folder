# One-command local stack:  cp .env.example .env && docker compose up --build
# Opens http://localhost:8000 . Default LAB_MODE=demo (synthetic data, clearly labeled).
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab@db:5432/lab
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab@db:5432/lab
    command: ["sh", "-c", "alembic upgrade head && exec python -m lab.worker"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
